<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__ — por local de votação</title>
<style>__LEAFLET_CSS__</style><script>__LEAFLET_JS__</script>
<style>
:root{--bg:#f6f6f4;--ink:#1a1a1a;--muted:#5a5a5a;--panel:#ffffffee;--border:#d8d8d4}
@media (prefers-color-scheme: dark){:root{--bg:#141414;--ink:#eee;--muted:#aaa;--panel:#1e1e1eee;--border:#333}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#map{position:absolute;inset:0;background:var(--bg)}
.panel{position:absolute;z-index:1000;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:10px 12px;box-shadow:0 2px 8px #0002;max-width:min(360px,calc(100vw - 32px))}
#title{top:12px;left:12px} #title h1{font-size:15px;margin:0 0 4px;font-weight:650} #title p{margin:0;color:var(--muted);font-size:12px}
#legend{bottom:24px;left:12px} .bar{height:12px;border-radius:3px;background:linear-gradient(90deg,#009a7b,#7fbfae,#9a9a9a,#d4a06e,#be6517)}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:3px}
#info{top:12px;right:12px;font-size:12.5px;min-width:250px;display:none} #info b{font-size:13px} #info .row{display:flex;justify-content:space-between;gap:12px;margin-top:2px}
#src{bottom:24px;right:12px;font-size:11px;color:var(--muted);max-width:340px}
.leaflet-container{font:inherit} label{display:block;margin-top:6px;font-size:12px} .sub{margin-left:18px}
</style></head><body>
<div id="map"></div>
<div id="title" class="panel"><h1>__TITLE__</h1>
<p>Resultado por local de votação (__NLOC__ locais em 39 municípios). Passe o mouse / toque para ver os números.</p>
<div id="candctl" style="display:none;margin-top:6px;font-size:12px">visualizar: <select id="candview"><option value="all">ternário (3 candidatos)</option><option value="1">só o 1º colocado no município</option><option value="2">só o 2º colocado</option><option value="3">só o 3º colocado</option></select>
<label class="sub" id="candsz" style="display:none"><input type="checkbox" id="candsize"> tamanho dos círculos ∝ votos do candidato (em vez do total do local)</label></div>
<div id="c26ctl" style="display:none;margin-top:6px;font-size:12px">cargo: <select id="cargo26"><option value="presidente">Presidente</option><option value="governador">Governador</option><option value="senador">Senador</option><option value="depfed">Deputado federal</option><option value="depest">Deputado estadual</option></select>
<div style="margin-top:4px">visualizar: <select id="view26" style="max-width:250px"></select></div>
<label class="sub" id="c26sz" style="display:none"><input type="checkbox" id="c26size"> tamanho dos círculos ∝ votos do candidato/partido (em vez do total do local)</label></div>
<label><input type="radio" name="mode" value="vor"> Voronoi (área geográfica)</label>
<label><input type="radio" name="mode" value="dor" checked> Círculos (área ∝ votos)</label>
<div id="dorctl">
<label class="sub">escala dos círculos: <b id="scaleval">0,6×</b><br><input type="range" id="scale" min="0.2" max="3" step="0.1" value="0.6" style="width:100%"></label>
<label class="sub"><input type="checkbox" id="force" checked> não sobrepor (relaxação por colisão, Dorling) <span id="fstat" style="color:var(--muted)"></span></label>
</div>
<label>opacidade dos dados (círculos/polígonos): <b id="dov">85%</b><br><input type="range" id="dop" min="0" max="1" step="0.05" value="0.85" style="width:100%"></label>
<div style="margin-top:8px;font-size:12px;color:var(--muted)">Mapas-base</div>
<label style="margin-top:2px"><input type="checkbox" id="rms"> rmsampa-v2 (Pedal Hidrográfico) · opacidade <b id="rmsv">70%</b><br><input type="range" id="rmso" min="0" max="1" step="0.05" value="0.7" style="width:100%"></label>
<label style="margin-top:2px"><input type="checkbox" id="tiles" checked> OpenStreetMap · opacidade <b id="osmv">100%</b><br><input type="range" id="osmo" min="0" max="1" step="0.05" value="1" style="width:100%"></label>
<label><input type="checkbox" id="lines" checked> contornos municipais</label></div>
<div id="info" class="panel"></div>
<div id="legend" class="panel">__LEGEND__<div style="font-size:11px;color:var(--muted);margin-top:6px">__SUMMARY__</div></div>
<div id="src" class="panel">__NOTE__</div>
<script>
const YEAR='__YEAR__', VOR=__VOR__, MUN=__MUN__, DOR=__DOR__, PROPS=__PROPS__;
const map=L.map('map',{preferCanvas:true}).setView([-23.62,-46.55],10);
const tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,opacity:1,attribution:'© OpenStreetMap'}).addTo(map);
const rms=L.tileLayer('https://telhas.pedalhidrografi.co/rmsampa-v2/{z}/{x}/{y}.png',{maxZoom:19,maxNativeZoom:17,opacity:0.7,attribution:'rmsampa-v2 © Pedal Hidrográfico'});
function bindBase(layer,cb,sl,lbl){document.getElementById(cb).onchange=e=>e.target.checked?layer.addTo(map):map.removeLayer(layer);const s=document.getElementById(sl);s.oninput=()=>{layer.setOpacity(+s.value);document.getElementById(lbl).textContent=Math.round(s.value*100)+'%'}}
bindBase(rms,'rms','rmso','rmsv');bindBase(tiles,'tiles','osmo','osmv');
const fmt=n=>Number(n).toLocaleString('pt-BR'); const pc=x=>Number(x).toFixed(1).replace('.',',')+'%'; const info=document.getElementById('info'); let sel=null;
const tc=s=>String(s).toLowerCase().replace(/(^|\s)\S/g,c=>c.toUpperCase());
function show(p){info.style.display='block';let body='';if(YEAR==='2026')return show26(p);
 if(p.nmA){body=`<div class="row" style="margin-top:6px"><span style="color:#b0142a;font-weight:600">${p.sgA} ${p.nrA} - ${tc(p.nmA)}${p.rA!=null?` <span style='font-weight:400;color:var(--muted)'>r=${p.rA>=0?'+':''}${p.rA}</span>`:''}</span><span>${fmt(p.va)} · <b>${pc(p.pct)}</b></span></div><div class="row"><span style="color:#2c3e9e;font-weight:600">${p.sgB} ${p.nrB} - ${tc(p.nmB)}${p.rB!=null?` <span style='font-weight:400;color:var(--muted)'>r=${p.rB>=0?'+':''}${p.rB}</span>`:''}</span><span>${fmt(p.vb)} · <b>${pc(100-p.pct)}</b></span></div>`}
 else{body=`<div style="margin-top:6px;font-size:11px;color:var(--muted)">${p.triway?'Disputa de três (top-2 < 85% no município)':'Disputa bipolar (top-2 ≥ 85% no município)'}</div>
 ${[[0,'#be6517','~Lula'],[1,'#009a7b','~Bolsonaro'],[2,'#876cca','outlier']].map(([k,c,tag])=>p['NM_VOTAVEL_'+k]?`<div class="row"><span style="color:${c};font-weight:600">${p['SG_'+k]} ${p['NR_VOTAVEL_'+k]} - ${tc(p['NM_VOTAVEL_'+k])} <span style="font-weight:400;color:var(--muted)">${tag}${p['r_lula22_'+k]!=null?' · r='+(p['r_lula22_'+k]>=0?'+':'')+Number(p['r_lula22_'+k]).toFixed(2):''}</span></span><span>${fmt(p['v'+k])} · <b>${pc(p['s'+k])}</b> <span style="color:var(--muted)">(${pc(100*p['v'+k]/Math.max(1,p.validos))} dos válidos)</span></span></div>`:'').join('')}`}
 info.innerHTML=`<b>${p.nome}</b><div style="color:var(--muted)">${p.end||''}${p.bairro?' · '+p.bairro:''}</div><div style="color:var(--muted)">${p.mun} · zona ${p.zona} · local ${p.nr}${p.n_locais>1?' ('+p.n_locais+' locais no mesmo endereço)':''} · ${p.n_secoes} seções</div>${body}
 <div class="row" style="color:var(--muted)"><span>Brancos / nulos</span><span>${fmt(p.branco)} / ${fmt(p.nulo)}</span></div><div class="row" style="color:var(--muted)"><span>Válidos</span><span>${fmt(p.validos)}</span></div>`}
function hook(l,p,base){l.on('mouseover',()=>{show(p);l.setStyle({weight:2,color:'#111'});l.bringToFront()});l.on('mouseout',()=>{if(sel!==l){l.setStyle(base);info.style.display='none'}});l.on('click',()=>{if(sel&&sel!==l)sel.setStyle(sel._base);sel=l;show(p);l.setStyle({weight:2,color:'#111'})});l._base=base;l._p=p}
let dataOp=0.85; const st=c=>({fillColor:c,fillOpacity:dataOp,color:c,opacity:dataOp,weight:0.6});
const SEQ=[[238,243,251],[178,205,232],[98,155,203],[33,102,172],[8,48,107]];
function seq(t){t=Math.max(0,Math.min(1,t));const x=t*(SEQ.length-1),i=Math.min(SEQ.length-2,Math.floor(x)),f=x-i;return `rgb(${SEQ[i].map((c,k)=>Math.round(c+(SEQ[i+1][k]-c)*f)).join(',')})`}
let candView='all', candSize=false, seqMax=50;
function poleOf(p,rank){for(let k=0;k<3;k++)if(p['rank_'+k]==rank)return k;return -1}
function candShare(p){const k=poleOf(p,+candView);return k<0?null:100*p['v'+k]/Math.max(1,p.validos)}
function colorFor(p){if(YEAR==='2026')return color26(p);if(YEAR!=='2024'||candView==='all')return p.color;const s=candShare(p);return s==null?'rgba(0,0,0,0)':seq(s/seqMax)}
function applyView(){const Ly=layers[YEAR];if(!Ly)return;
 if(YEAR==='2024'&&candView!=='all'){const vals=Ly.circles.map(c=>candShare(c._p)).filter(x=>x!=null).sort((a,b)=>a-b);seqMax=Math.max(5,Math.ceil(vals[Math.floor(vals.length*0.95)]||50))}
 if(YEAR==='2026'&&view26.startsWith('d:')){const vals=Ly.circles.map(c=>delta26(c._p)).filter(x=>x!=null).map(Math.abs).sort((a,b)=>a-b);seqMax=Math.max(5,Math.ceil(vals[Math.floor(vals.length*0.95)]||10))}
 else if(YEAR==='2026'&&view26!=='tern'){const vals=Ly.circles.map(c=>share26(c._p)).sort((a,b)=>a-b);seqMax=Math.max(2,Math.ceil(vals[Math.floor(vals.length*0.95)]||50))}
 Ly.vor.eachLayer(l=>{const p=l._p;l._base=st(colorFor(p));if(l!==sel)l.setStyle(l._base)});
 Ly.circles.forEach(c=>{const p=c._p;c._base=st(colorFor(p));if(c!==sel)c.setStyle(c._base);let f=1;if(YEAR==='2026'&&view26!=='tern'&&!view26.startsWith('d:')&&c26Size){const c=C26();f=Math.sqrt(c.V[view26][p.i]/Math.max(1,c.validos[p.i]))}if(YEAR==='2024'&&candView!=='all'&&candSize){const k=poleOf(p,+candView);f=k<0?0:Math.sqrt(p['v'+k]/Math.max(1,p.va!==undefined?p.va+p.vb:(p.v0+p.v1+p.v2)))}c._f=f;c.setRadius(c._r0*scaleK*f)});
 renderLegend();if(forceOn&&document.querySelector('input[name=mode]:checked').value==='dor')runForce()}
function renderLegend(){const D=DATA[YEAR];if(YEAR==='2026')return legend26();let html=D.legend;
 if(YEAR==='2024'&&candView!=='all'){html=`<div style="font-size:12px;margin-bottom:4px">% dos votos válidos do local — ${['','1º','2º','3º'][+candView]} colocado no município</div><div class="bar" style="width:260px;background:linear-gradient(90deg,rgb(238,243,251),rgb(178,205,232),rgb(98,155,203),rgb(33,102,172),rgb(8,48,107))"></div><div class="ticks" style="width:260px"><span>0%</span><span>≥${seqMax}% (p95)</span></div><div style="font-size:11px;color:var(--muted);margin-top:4px">Cada município tem seu próprio candidato nessa posição — veja no hover. Locais sem esse candidato ficam transparentes.</div>`}
 document.getElementById('legend').innerHTML=html+`<div style="font-size:11px;color:var(--muted);margin-top:6px">${D.summary}</div>`}
document.getElementById('candview').onchange=e=>{candView=e.target.value;document.getElementById('candsz').style.display=candView==='all'?'none':'block';applyView()};
document.getElementById('candsize').onchange=e=>{candSize=e.target.checked;applyView()};
// --- 2026: one geometry, five offices; colors computed from per-office vote columns (cargos[k].V[key][i]) ---
let cargo='presidente', view26='tern', c26Size=false;
const C26=()=>DATA['2026'].cargos[cargo]; const pc2=x=>Number(x).toFixed(2).replace('.',',')+'%';
const sur=s=>nm26(s).split(' ').pop();const nm26=s=>tc(s).replace(/ (Da|De|Do|Das|Dos|E|Para) /g,m=>m.toLowerCase());
const DIV=['#2c3e9e','#7f95d6','#e4e4e4','#e69a86','#b0142a'];
function divc(t){t=Math.max(0,Math.min(1,t));const x=t*4,i=Math.min(3,Math.floor(x)),f=x-i,a=DIV[i],b=DIV[i+1],h=(s,k)=>parseInt(s.slice(1+2*k,3+2*k),16);return `rgb(${[0,1,2].map(k=>Math.round(h(a,k)+(h(b,k)-h(a,k))*f)).join(',')})`}
const DLBL={'d:L':'Lula','d:B':'lado Bolsonaro (Flávio 2026 vs. Jair 2022)','d:M':'margem Lula − Bolsonaro'};
function delta26(p){const c=C26(),q=c.prev,i=p.i;if(!q||!q.validos[i]||!c.validos[i])return null;const v=c.validos[i],w=q.validos[i],L=c.V[String(c.lulaNr)][i]/v,B=c.V[String(c.bolsoNr)][i]/v,L0=q.lula[i]/w,B0=q.bolso[i]/w;
 return 100*(view26==='d:L'?L-L0:view26==='d:B'?B-B0:(L-B)-(L0-B0))}
function share26(p){const c=C26();return 100*c.V[view26][p.i]/Math.max(1,c.validos[p.i])}
function color26(p){const c=C26();if(view26==='tern')return c.color[p.i];if(view26.startsWith('d:')){const d=delta26(p);return d==null?'rgba(0,0,0,0)':divc(0.5+(view26==='d:B'?-d:d)/(2*seqMax))}return c.validos[p.i]?seq(share26(p)/seqMax):'rgba(0,0,0,0)'}
function lbl26(k){const c=C26();if(k[0]==='p'||k[0]==='f'){const q=c.parties.find(x=>x.k===k);return `${q.sg}${q.fed?' ('+q.fed+')':''}`}const d=c.cands.find(x=>String(x.nr)===k);return `${nm26(d.nm)} (${d.sg} ${d.nr})`}
function setCargo(k){cargo=k;const c=C26();let h='';
 if(c.kind==='maj'){h+=`<option value="tern">${c.slates?'bipolar: as 2 chapas mais votadas':c.triway?'ternário (3 mais votados na RMSP)':'bipolar (2 mais votados na RMSP)'}</option><optgroup label="Candidato — % dos válidos">`+c.cands.map(d=>`<option value="${d.nr}">${nm26(d.nm)} (${d.sg}) · ${pc(d.s)}</option>`).join('')+'</optgroup>'+(c.prev?'<optgroup label="Variação vs. 2022 (1º turno), pontos percentuais">'+Object.entries(DLBL).map(([k,l])=>`<option value="${k}">Δ ${l}</option>`).join('')+'</optgroup>':'');view26='tern'}
 else{h+='<optgroup label="Partido — nominais + legenda">'+c.parties.filter(q=>q.s>=0.05).map(q=>`<option value="${q.k}">${q.sg}${q.fed?' ('+q.fed+')':''} · ${pc(q.s)}</option>`).join('')+`</optgroup><optgroup label="Candidato — ${c.cands.length} mais votados na RMSP">`+c.cands.map(d=>`<option value="${d.nr}">${nm26(d.nm)} (${d.sg} ${d.nr}) · ${fmt(d.v)}</option>`).join('')+'</optgroup>';view26=c.parties.find(q=>q.k[0]==='p').k}
 const s=document.getElementById('view26');s.innerHTML=h;s.value=view26;document.getElementById('c26sz').style.display=view26==='tern'||view26.startsWith('d:')?'none':'block'}
function legend26(){const D=DATA['2026'],c=C26();let html='';const P=c.pc||D.poles;
 if(view26==='tern'){const top=c.cands.filter(d=>d.pole!=null);
  if(c.triway){const by=k=>top.find(d=>d.pole===k);html=`<div style="font-size:12px;margin-bottom:4px">${[0,1,2].map(k=>`<span style="color:${P[k]};font-weight:600">${nm26(by(k).nm)}</span>`).join(' · ')}</div><svg width="150" height="130" viewBox="0 0 150 130">${D.tri}<text x="75" y="6" font-size="9" text-anchor="middle" fill="${P[0]}">100% ${sur(by(0).nm)}</text><text x="2" y="129" font-size="9" fill="${P[1]}">100% ${sur(by(1).nm)}</text><text x="148" y="129" font-size="9" text-anchor="end" fill="${P[2]}">100% ${sur(by(2).nm)}</text></svg><div style="font-size:11px;color:var(--muted)">Mistura ternária dos 3 mais votados na RMSP (cinza = três iguais); cor pelo r com Lula 2026 (veja o hover).</div>`}
  else{const [a,b]=[...(c.slates||top)].sort((x,y)=>x.pole-y.pole);const who=d=>d.members?d.members.map(n=>nm26(c.cands.find(x=>x.nr===n).nm)).join(' + '):'';
   html=`<div style="font-size:12px;margin-bottom:4px"><span style="color:${P[a.pole]};font-weight:600">${nm26(a.nm)}</span>${a.members?' ('+who(a)+')':''} vs. <span style="color:${P[b.pole]};font-weight:600">${nm26(b.nm)}</span>${b.members?' ('+who(b)+')':''}</div><div class="bar" style="width:260px;background:linear-gradient(90deg,${(c.grad||[P[b.pole],'#9a9a9a',P[a.pole]]).join(',')})"></div><div class="ticks" style="width:260px"><span>≥${c.hi||75}% ${c.slates?'chapa '+sur(b.members?c.cands.find(x=>x.nr===b.members[0]).nm:b.nm):nm26(b.nm)}</span><span>50/50</span><span>≥${c.hi||75}% ${c.slates?'chapa '+sur(c.cands.find(x=>x.nr===a.members[0]).nm):nm26(a.nm)}</span></div><div style="font-size:11px;color:var(--muted);margin-top:4px">${c.slates?'Fração entre as duas chapas (coligações) mais votadas, somando os 2 candidatos de cada uma (cada eleitor votou em 2 nomes); escala ajustada ao percentil 95 dos locais.':c.grad?'Fração de cada um entre os dois mais votados; escala ajustada ao percentil 95 dos locais (como nos mapas de 2º turno).':'Fração entre os dois mais votados na RMSP (os 2 somam ≥85% dos válidos).'}</div>`}}
 else if(view26.startsWith('d:')){const q=c.prev,n=q.validos.length;let a=[0,0,0,0,0,0],m=0;for(let i=0;i<n;i++){if(!q.validos[i]||!c.validos[i])continue;m++;a[0]+=c.V[String(c.lulaNr)][i];a[1]+=c.V[String(c.bolsoNr)][i];a[2]+=c.validos[i];a[3]+=q.lula[i];a[4]+=q.bolso[i];a[5]+=q.validos[i]}
  const L=100*a[0]/a[2],B=100*a[1]/a[2],L0=100*a[3]/a[5],B0=100*a[4]/a[5],pp=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(1).replace('.',',')+' pp',up=view26==='d:B'?'mais Bolsonaro':'mais Lula',dn=view26==='d:B'?'menos Bolsonaro':'menos Lula';
  html=`<div style="font-size:12px;margin-bottom:4px">Variação 2022 (1º turno) → 2026 — <b>${DLBL[view26]}</b>, pontos percentuais dos válidos</div><div class="bar" style="width:260px;background:linear-gradient(90deg,${DIV.join(',')})"></div><div class="ticks" style="width:260px"><span>${view26==='d:B'?'+':'−'}${seqMax} pp</span><span>0</span><span>${view26==='d:B'?'−':'+'}${seqMax} pp</span></div><div style="font-size:11px;color:var(--muted);margin-top:4px">Vermelho = deslocamento para o lado de Lula, azul = para o de Bolsonaro (p95). Nos ${fmt(m)} locais comparados: Lula ${pc(L0)} → ${pc(L)} (${pp(L-L0)}), Bolsonaro ${pc(B0)} → ${pc(B)} (${pp(B-B0)}). Locais casados por município/zona/número (endereço a ≤300 m) ou pelo local de 2022 mais próximo (≤150 m); eleitores mudam de local entre eleições, então a comparação é aproximada.</div>`}
 else html=`<div style="font-size:12px;margin-bottom:4px">% dos votos válidos do local — <b>${lbl26(view26)}</b></div><div class="bar" style="width:260px;background:linear-gradient(90deg,rgb(238,243,251),rgb(178,205,232),rgb(98,155,203),rgb(33,102,172),rgb(8,48,107))"></div><div class="ticks" style="width:260px"><span>0%</span><span>≥${seqMax}% (p95)</span></div>`;
 const list=(c.kind==='maj'?c.cands:c.parties).slice(0,5).map(d=>`${d.sg&&c.kind==='maj'?nm26(d.nm):d.sg} ${pc(d.s)}`).join(' · ');
 document.getElementById('legend').innerHTML=html+`<div style="font-size:11px;color:var(--muted);margin-top:6px">RMSP, ${c.label.toLowerCase()}: ${list}${D.partial?'<br><b>'+D.partial+'</b>':''}</div>`}
function show26(p){const c=C26(),i=p.i,val=Math.max(1,c.validos[i]);const P=c.pc||DATA['2026'].poles;
 const party=c.kind==='prop'&&view26[0]!=='t'&&isNaN(view26);const items=party?c.parties.filter(q=>q.k[0]==='p'||q.k===view26).map(q=>({k:q.k,t:`${q.sg}${q.fed?' ('+q.fed+')':''}`})):c.cands.map(d=>({k:String(d.nr),t:`${d.sg} ${d.nr} - ${nm26(d.nm)}`,pole:view26==='tern'?d.pole:null,r:d.r}));
 items.forEach(x=>x.v=c.V[x.k][i]);const top=items.filter(x=>x.v>0).sort((a,b)=>b.v-a.v);let rows=top.slice(0,7);const cur=top.find(x=>x.k===view26);if(cur&&!rows.includes(cur))rows.push(cur);
 const body=rows.map(x=>{const col=x.pole!=null?P[x.pole]:x.k===view26?'#21569c':'inherit';return `<div class="row"><span style="color:${col};font-weight:${x.k===view26||x.pole!=null?600:400}">${x.t}${x.r!=null&&x.pole!=null?` <span style='font-weight:400;color:var(--muted)'>r=${x.r>=0?'+':''}${x.r.toFixed(2)}</span>`:''}</span><span>${fmt(x.v)} · <b>${pc(100*x.v/val)}</b></span></div>`}).join('');
 info.innerHTML=`<b>${p.nome}</b><div style="color:var(--muted)">${p.end||''}${p.bairro?' · '+p.bairro:''}</div><div style="color:var(--muted)">${p.mun} · zona ${p.zona} · local ${p.nr}${p.n_locais>1?' ('+p.n_locais+' locais no mesmo endereço)':''} · ${p.n_secoes}${p.n_secoes<p.n_secoes_tot?' de '+p.n_secoes_tot:''} seções apuradas</div><div style="margin-top:6px;font-size:11px;color:var(--muted)">${c.label}${party?' — partidos (nominais + legenda)':c.kind==='prop'?' — candidatos ('+c.cands.length+' mais votados na RMSP)':''}</div>${body}
 <div class="row" style="color:var(--muted)"><span>Brancos / nulos</span><span>${fmt(c.branco[i])} / ${fmt(c.nulo[i])}</span></div><div class="row" style="color:var(--muted)"><span>Válidos${cargo==='senador'?' (2 votos por eleitor)':''}</span><span>${fmt(c.validos[i])}</span></div>${c.prev&&c.prev.validos[i]?(()=>{const q=c.prev,w=q.validos[i],L=100*c.V[String(c.lulaNr)][i]/val,B=100*c.V[String(c.bolsoNr)][i]/val,L0=100*q.lula[i]/w,B0=100*q.bolso[i]/w,pp=x=>(x>=0?'+':'−')+Math.abs(x).toFixed(1).replace('.',',')+' pp';
 return `<div style="margin-top:6px;font-size:11px;color:var(--muted)">2022, 1º turno (${fmt(w)} válidos)</div><div class="row"><span style="color:#b0142a">Lula</span><span>${pc(L0)} → ${pc(L)} <b>${pp(L-L0)}</b></span></div><div class="row"><span style="color:#2c3e9e">Jair → Flávio Bolsonaro</span><span>${pc(B0)} → ${pc(B)} <b>${pp(B-B0)}</b></span></div>`})():''}`}

const dop=document.getElementById('dop');dop.oninput=()=>{dataOp=+dop.value;document.getElementById('dov').textContent=Math.round(dataOp*100)+'%';const Ly=layers[YEAR];if(!Ly)return;Ly.vor.eachLayer(l=>{l._base=st(colorFor(l._p));if(l!==sel)l.setStyle(l._base)});Ly.circles.forEach(c=>{c._base=st(colorFor(c._p));if(c!==sel)c.setStyle(c._base)})};
const vor=L.geoJSON(VOR,{style:f=>st(f.properties.color),onEachFeature:(f,l)=>hook(l,f.properties,st(f.properties.color))}).addTo(map);
const circles=DOR.map(([lat,lng,r],i)=>{const p=PROPS[i];const c=L.circle([lat,lng],{radius:r,...st(p.color)});c._r0=r;c._ll0=[lat,lng];c._p=p;hook(c,p,st(p.color));return c});const dor=L.layerGroup(circles);

// --- force layout (collision relaxation in projected metres) ---
const crs=L.CRS.EPSG3857; const lat0=-23.6; const kM=1/Math.cos(lat0*Math.PI/180); // metres -> mercator units
let scaleK=0.6, forceOn=true, animId=null;
const P0=circles.map(c=>{const q=crs.project(L.latLng(c._ll0));return [q.x,q.y]});
let P=P0.map(a=>a.slice());
function relax(iters){const n=P.length; const R=circles.map(c=>c._r0*scaleK*(c._f==null?1:c._f)*kM+1e-3); const M=R.map(r=>r*r); const rmax=Math.max(...R); const cell=2*rmax;
 for(let it=0;it<iters;it++){const grid=new Map();for(let i=0;i<n;i++){const k=((P[i][0]/cell)|0)+','+((P[i][1]/cell)|0);(grid.get(k)||grid.set(k,[]).get(k)).push(i)}
  const dx=new Float64Array(n),dy=new Float64Array(n);let maxov=0;
  for(let i=0;i<n;i++){const gx=(P[i][0]/cell)|0,gy=(P[i][1]/cell)|0;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){const L2=grid.get((gx+a)+','+(gy+b));if(!L2)continue;for(const j of L2){if(j<=i)continue;let ex=P[j][0]-P[i][0],ey=P[j][1]-P[i][1];let d=Math.hypot(ex,ey);if(d===0){d=1e-6;ex=1e-6}const ov=R[i]+R[j]-d;if(ov<=0)continue;maxov=Math.max(maxov,ov/Math.min(R[i],R[j]));const ux=ex/d,uy=ey/d,wi=M[j]/(M[i]+M[j]),wj=1-wi;dx[i]-=ux*ov*wi;dy[i]-=uy*ov*wi;dx[j]+=ux*ov*wj;dy[j]+=uy*ov*wj}}}
  for(let i=0;i<n;i++){P[i][0]+=dx[i]*0.8;P[i][1]+=dy[i]*0.8}
  if(maxov<0.03)return true}
 return false}
function applyPos(){circles.forEach((c,i)=>{const ll=crs.unproject(L.point(P[i][0],P[i][1]));c.setLatLng(ll)})}
function runForce(){if(animId)cancelAnimationFrame(animId);P=P0.map(a=>a.slice());let it=0;const step=()=>{const done=relax(8);it+=8;applyPos();document.getElementById('fstat').textContent=done?'✓':`… ${it}`;if(!done&&it<1500)animId=requestAnimationFrame(step);else animId=null};animId=requestAnimationFrame(step)}
function reset(){if(animId)cancelAnimationFrame(animId);animId=null;P=P0.map(a=>a.slice());applyPos();document.getElementById('fstat').textContent=''}
const sc=document.getElementById('scale');sc.oninput=()=>{scaleK=+sc.value;document.getElementById('scaleval').textContent=scaleK.toFixed(1).replace('.',',')+'×';circles.forEach(c=>c.setRadius(c._r0*scaleK*(c._f==null?1:c._f)));if(forceOn)runForce()};
document.getElementById('force').onchange=e=>{forceOn=e.target.checked;forceOn?runForce():reset()};
document.querySelectorAll('input[name=mode]').forEach(e=>e.onchange=ev=>{const d=ev.target.value==='dor';document.getElementById('dorctl').style.display=d?'block':'none';if(d){map.removeLayer(vor);dor.addTo(map);mun.setStyle({color:'#999',weight:0.8})}else{map.removeLayer(dor);vor.addTo(map);mun.setStyle({color:'#222',weight:1.1})};mun.bringToFront()});
document.getElementById('lines').onchange=e=>e.target.checked?mun.addTo(map):map.removeLayer(mun);
